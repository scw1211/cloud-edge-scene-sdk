<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>云边协同运行与演示</title>
  <style>
    :root{--fs-body:16px;--fs-lead:24px;--fs-h1:32px;

      color:var(--ink);background:var(--bg)
    }
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}
    button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
    .app{height:100dvh;display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
    .sidebar{display:flex;flex-direction:column;padding:22px 12px 16px;background:var(--nav);color:var(--nav-ink)}.brand{display:flex;align-items:center;gap:11px;padding:0 10px 22px;color:#fff;font-size:var(--fs-body);font-weight:600}.brand-mark{width:30px;height:30px;display:grid;place-items:center;border:1px solid #3b434c;border-radius:8px;background:#161b22;color:#58a6ff;font-size:var(--fs-body)}.nav-label{padding:15px 11px 8px;color:#6e7681;font-size:var(--fs-body);font-weight:600}.nav-button{width:100%;height:46px;display:flex;align-items:center;gap:10px;padding:0 11px;border:0;border-radius:6px;background:transparent;color:#b1bac4;text-align:left;font-size:var(--fs-body)}
    .nav-button:hover{background:#161b22;color:#fff}.nav-button.active{background:#21262d;color:#fff;font-weight:600}.nav-num{width:26px;color:#7d8590;font-size:var(--fs-body);font-weight:600}.nav-button.active .nav-num{color:#58a6ff}
    .main{min-width:0;min-height:0;display:grid;grid-template-rows:var(--topbar) minmax(0,1fr)}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--line);background:#fff}.top-title{font-size:var(--fs-body);font-weight:600}
    .top-actions{display:flex;align-items:center;gap:10px}.live-state{display:flex;align-items:center;gap:7px;margin-right:5px;color:var(--muted);font-size:var(--fs-body)}
    .live-dot{width:7px;height:7px;border-radius:50%;background:var(--quiet)}.live-dot.ok{background:var(--green)}.live-dot.partial{background:var(--amber)}.button{height:42px;padding:0 17px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);font-size:var(--fs-body);font-weight:600}.button:hover{background:#f6f8fa}.button.primary{border-color:var(--blue);background:var(--blue);color:#fff}.button:disabled{opacity:.45;cursor:not-allowed}
    .content{min-height:0;overflow:hidden}.page{display:none;height:100%;overflow:auto;padding:30px 34px 34px}.page.active{display:block}
    .wrap{max-width:1320px;margin:0 auto}.page-head{margin-bottom:26px}.page-kicker{margin:0 0 7px;color:var(--blue);font-size:var(--fs-body);font-weight:700;letter-spacing:.05em}.page-head h1{margin:0;font-size:var(--fs-h1);line-height:1.2;letter-spacing:-.025em}.status{display:inline-flex;align-items:center;gap:7px;min-height:28px;padding:4px 11px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--muted);font-size:var(--fs-body);font-weight:600;white-space:nowrap}
    .status:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--quiet)}.status.measured{color:var(--green)}.status.measured:before{background:var(--green)}.status.partial{color:var(--blue)}.status.partial:before{background:var(--blue)}.status.pending{color:var(--amber)}.status.pending:before{background:var(--amber)}.status.failed{color:var(--red)}.status.failed:before{background:var(--red)}
    /* overview */
    .overview-hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(360px,.75fr);gap:18px;margin-bottom:14px;flex:1.35 1 auto;min-height:0;max-height:300px}
    .hero-main,.hero-side,.rubric-card,.criterion,.simple-card,.scene-card,.runtime-card{border:1px solid var(--line);border-radius:10px;background:#fff}
    .hero-main{display:flex;flex-direction:column;justify-content:center;padding:30px 34px}.hero-main h2{max-width:760px;margin:0;font-size:var(--fs-h1);line-height:1.28;letter-spacing:-.025em}
    .hero-chain{display:flex;align-items:center;gap:9px;padding-top:32px}.hero-node{flex:1;min-width:0;padding:15px 10px;border:1px solid var(--line-soft);border-radius:8px;background:#f6f8fa;text-align:center;font-size:var(--fs-body);font-weight:600}.hero-arrow{color:var(--quiet);font-size:var(--fs-body)}
    .hero-side{display:flex;flex-direction:column;padding:24px}.hero-side label{display:block;color:var(--quiet);font-size:var(--fs-body)}.hero-facts{flex:1 1 auto;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line-soft);border:1px solid var(--line-soft)}.hero-fact{display:flex;flex-direction:column;justify-content:center;padding:15px 17px;background:#fff}.hero-fact b{display:block;font-size:var(--fs-lead);letter-spacing:-.02em}.hero-fact span{display:block;margin-top:5px;color:var(--muted);font-size:var(--fs-body)}
    .capability-state-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 0 14px}.capability-state{display:grid;grid-template-columns:42px minmax(0,1fr);align-items:center;min-height:68px;padding:10px 14px;border:1px solid var(--line);border-radius:9px;background:#fff}.capability-symbol{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;font-size:22px;font-weight:800}.capability-copy{min-width:0}.capability-copy b{display:block;font-size:16px;line-height:1.3}.capability-copy span{display:block;margin-top:3px;font-size:15px;font-weight:700}.capability-state.measured .capability-symbol{background:#dafbe1;color:var(--green)}.capability-state.measured .capability-copy span{color:var(--green)}.capability-state.partial .capability-symbol{background:#fff8c5;color:var(--amber)}.capability-state.partial .capability-copy span{color:var(--amber)}.capability-state.na .capability-symbol{background:#eaeef2;color:var(--muted)}.capability-state.na .capability-copy span{color:var(--muted)}
    .rubric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;flex:1 1 auto;min-height:0;max-height:190px}.rubric-card{display:flex;flex-direction:column;justify-content:center;padding:18px 21px;text-align:left;transition:.15s}.rubric-card:hover{border-color:#afb8c1;box-shadow:0 5px 18px rgba(31,35,40,.06)}.rubric-card .tag{color:var(--blue);font-size:var(--fs-body);font-weight:700}.rubric-card h2{margin:9px 0 13px;font-size:var(--fs-lead);line-height:1.32}.rubric-foot{display:flex;align-items:center;justify-content:space-between}.rubric-foot span:last-child{color:var(--blue);font-size:var(--fs-body);font-weight:600}
    /* criteria */
    #effect-page .wrap,#stable-page .wrap,#overview-page .wrap,#complete-page .wrap,#innovation-page .wrap,#runtime-page .wrap,#deploy-page .wrap,#monitor-page .wrap,#finalscore-page .wrap{display:flex;flex-direction:column;height:100%}.page-head{flex:0 0 auto}
    .criteria-grid{display:flex;flex-direction:column;gap:12px;flex:1 1 auto;min-height:0}.criteria-grid:has(.score-measurements[open]){flex:0 0 auto;min-height:auto}
    .criterion{display:grid;grid-template-columns:266px minmax(0,1fr);flex:0 1 auto;overflow:hidden}.criterion:has(.score-measurements[open]){flex-shrink:0}
    .criterion-title{display:flex;flex-direction:column;align-items:flex-start;padding:22px;border-right:1px solid var(--line-soft);background:#fbfcfd}.criterion-title b{display:block;color:var(--blue);font-size:var(--fs-body);font-weight:700}.criterion-title h2{margin:9px 0 9px;font-size:var(--fs-lead);line-height:1.3}
    .criterion-body{display:flex;flex-direction:column;justify-content:center;padding:4px 21px}.evidence-row{display:grid;grid-template-columns:minmax(190px,1.15fr) minmax(150px,.8fr) minmax(200px,1.2fr) 106px;align-items:center;gap:16px;flex:1 1 auto;min-height:54px;border-top:1px solid var(--line-soft)}.evidence-row:first-child{border-top:0}.evidence-name b{display:block;font-size:var(--fs-body)}.metric{font-size:var(--fs-lead);font-weight:700;letter-spacing:-.02em}.metric small{margin-left:5px;color:var(--muted);font-size:var(--fs-body);font-weight:400}
    /* completeness and architecture */
    .two-col{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;flex:1 1 auto;min-height:0}.simple-card{display:flex;flex-direction:column;padding:23px 25px}.simple-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:15px}.simple-card b{display:block;margin-bottom:8px;color:var(--blue);font-size:var(--fs-body);font-weight:700}.simple-card h2{margin:0;font-size:var(--fs-lead)}.simple-card .mini-chain{display:flex;align-items:center;gap:7px;margin-top:20px}.mini-node{flex:1;padding:13px 8px;border:1px solid var(--line-soft);border-radius:7px;background:#f6f8fa;text-align:center;font-size:var(--fs-body);font-weight:600}.mini-arrow{color:var(--quiet);font-size:var(--fs-body)}.fact-list{display:flex;flex-direction:column;flex:1 1 auto;margin:19px 0 0;padding:0;list-style:none}.fact-list li{display:flex;flex:1 1 auto;align-items:center;justify-content:space-between;gap:16px;padding:13px 0;border-top:1px solid var(--line-soft);font-size:var(--fs-body)}.fact-list span{color:var(--muted)}.fact-list strong{text-align:right;font-weight:600}
    .scene-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}.scene-card{display:grid;grid-template-columns:1fr 1.1fr;min-height:198px;overflow:hidden}.scene-copy{padding:21px}.scene-copy h3{margin:0;font-size:var(--fs-lead)}.scene-copy strong{display:block;margin-top:13px;color:var(--blue);font-size:var(--fs-lead)}.scene-visual{display:flex;align-items:center;justify-content:center;gap:7px;padding:15px;background:#f6f8fa}.region-tile{width:58px;height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:var(--fs-body)}.region-tile b{margin-top:8px;font-size:var(--fs-lead)}.industrial-img{width:47%;height:136px;object-fit:contain;border:1px solid var(--line);border-radius:6px;background:#fff}
    .arch-flow{display:grid;grid-template-columns:1fr 40px 1fr 40px 1fr 40px 1fr;align-items:stretch;margin-top:12px}.arch-node{display:flex;flex-direction:column;justify-content:center;gap:9px;min-height:132px;padding:19px 21px;border:1px solid var(--line);border-radius:9px;background:#fff}.arch-node small{color:var(--blue);font-size:var(--fs-body);font-weight:700}.arch-node h3{margin:0;font-size:var(--fs-lead);line-height:1.3}.arch-arrow{display:grid;place-items:center;color:var(--quiet);font-size:var(--fs-body)}
    #architecture-page .wrap{display:flex;flex-direction:column;height:100%}.arch-flow{flex:0 0 auto}
    .ownership{display:flex;flex-direction:column;flex:1 1 auto;margin-top:16px;border:1px solid var(--line);border-radius:9px;background:#fff;overflow:hidden}.ownership-head{flex:0 0 auto}.ownership-row{flex:1 1 auto;align-items:center}.ownership-head,.ownership-row{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:13px 22px}.ownership-head{background:#f6f8fa;color:var(--muted);font-size:var(--fs-body);font-weight:600}.ownership-row{border-top:1px solid var(--line-soft);font-size:var(--fs-body)}.ownership-row strong{text-align:right;font-weight:600}.ownership-head span:last-child{text-align:right}.ownership-row span{color:var(--muted)}
    /* innovation */
    .sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin:0 0 13px}.sec-head b{display:block;color:var(--blue);font-size:var(--fs-body);font-weight:700}.sec-head h2{margin:6px 0 0;font-size:var(--fs-lead)}
    .innovation-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;flex:1.5 1 auto;min-height:0;max-height:330px}.innovation-card{display:flex;flex-direction:column;padding:20px 22px;border:1px solid var(--line);border-radius:10px;background:#fff}.innovation-card .index{color:var(--blue);font-size:var(--fs-body);font-weight:700}.innovation-card h2{margin:11px 0 8px;font-size:var(--fs-lead);line-height:1.3}.innovation-card .proof{display:grid;gap:9px;margin-top:auto;padding-top:12px;border-top:1px solid var(--line-soft);font-size:var(--fs-body);font-weight:600;line-height:1.45}.innovation-card .proof div+div{padding-top:8px;border-top:1px solid var(--line-soft)}.innovation-card .proof small{display:block;margin-top:3px;color:var(--muted);font-size:var(--fs-body);font-weight:400}.claim-limit{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;max-height:230px;margin-top:14px;padding:17px 22px;border:1px solid var(--line);border-radius:9px;background:#fff}.claim-limit b{display:block;margin-bottom:7px;color:var(--blue);font-size:var(--fs-body);font-weight:700}.claim-limit h3{margin:0 0 10px;font-size:var(--fs-lead)}.limit-row{display:grid;grid-template-columns:minmax(0,1fr) 118px;align-items:center;flex:1 1 auto;gap:16px;padding:10px 0;border-top:1px solid var(--line-soft);font-size:var(--fs-body)}.limit-row:first-of-type{border-top:0}
    /* score-aligned experiments: consistent academic reading order */
    .criterion:has(.score-experiment-grid){flex-shrink:0}.score-experiment-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;padding:12px 0}.score-experiment-grid.single{grid-template-columns:minmax(0,1fr)}.score-experiment{display:block;min-width:0;padding:0;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);text-align:left;scroll-margin-top:78px;overflow:hidden}.score-experiment:hover{border-color:#9da7b1;box-shadow:0 3px 10px rgba(31,35,40,.05)}.score-experiment:focus-visible{outline:2px solid #365f7d;outline-offset:2px}.score-experiment-head{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line-soft);background:#fbfcfd}.score-experiment-heading{min-width:0}.score-experiment-scope{display:block;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.035em}.score-experiment-heading h3{margin:4px 0 0;font-size:17px;font-weight:650;line-height:1.35}.score-experiment-direction{padding-top:2px;color:var(--quiet);font-size:12px;white-space:nowrap}.score-experiment-body{display:grid;grid-template-columns:minmax(250px,.9fr) minmax(340px,1.1fr)}.score-experiment-context{display:grid;align-content:start;gap:12px;padding:14px 16px;border-right:1px solid var(--line-soft)}.experiment-section-label{display:block;margin-bottom:5px;color:var(--quiet);font-size:12px;font-weight:700;letter-spacing:.025em}.experiment-question{display:block;font-size:14px;font-weight:600;line-height:1.48}.experiment-design{display:grid;gap:5px}.experiment-arm{display:grid;grid-template-columns:36px minmax(0,1fr);align-items:start;gap:7px;color:var(--muted);font-size:13px;line-height:1.4}.experiment-arm i{display:grid;place-items:center;width:34px;height:20px;border:1px solid #a8b0b8;border-radius:3px;color:#606a73;font-size:11px;font-style:normal;font-weight:800}.experiment-arm i.system{border-color:#57758c;background:#edf2f5;color:#31566f}.score-experiment-result{display:grid;align-content:start;padding:14px 16px}.score-experiment-result-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:9px}.score-experiment-result-head .experiment-section-label{margin:0}.score-experiment-metric{color:var(--muted);font-size:12px}.score-experiment-plot{display:grid;gap:8px}.score-experiment-row{display:grid;grid-template-columns:36px minmax(120px,.7fr) minmax(80px,1fr) minmax(88px,.4fr);align-items:center;gap:8px}.score-experiment-series{color:var(--muted);font-size:11px;font-weight:800}.score-experiment-label{min-width:0;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.score-experiment-track{height:7px;background:#edf0f2;overflow:hidden}.score-experiment-bar{height:100%;min-width:3px;background:#9099a2}.score-experiment-bar.system{background:#456b84}.score-experiment-value{text-align:right;font-size:13px;font-weight:750;font-variant-numeric:tabular-nums;white-space:nowrap}.score-experiment-scene-table{display:grid;border-top:1px solid var(--line-soft)}.score-experiment-scene-row{display:grid;grid-template-columns:70px minmax(120px,.75fr) minmax(180px,1.25fr);align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:13px}.score-experiment-scene-row b{font-size:13px}.score-experiment-scene-row span{font-variant-numeric:tabular-nums}.score-experiment-scene-row small{color:var(--muted);font-size:13px;line-height:1.4}.score-experiment-conclusion{display:grid;grid-template-columns:64px minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line-soft);background:#fcfcfd;font-size:13px;line-height:1.45}.score-experiment-conclusion .experiment-section-label{margin:0}.score-experiment-summary{color:#3f474f}.score-experiment-summary b{font-weight:750;font-variant-numeric:tabular-nums}.score-experiment-more{color:#577084;font-size:12px;white-space:nowrap}.score-measurements{margin:0 0 10px;border-top:1px solid var(--line-soft)}.score-measurements summary{padding:11px 2px;color:#456b84;font-size:var(--fs-body);font-weight:650;cursor:pointer}.score-measurements[open]{padding-bottom:5px}.score-measurements-body{border-top:1px solid var(--line-soft)}.comparison-chart{display:grid;gap:18px;margin-top:20px}.comparison-metric{display:grid;grid-template-columns:145px minmax(0,1fr);gap:16px;align-items:center}.comparison-metric-name b{display:block;font-size:var(--fs-body)}.comparison-metric-name span{display:block;margin-top:4px;color:var(--muted);font-size:13px}.comparison-bars{display:grid;gap:8px}.comparison-bar-row{display:grid;grid-template-columns:minmax(105px,.45fr) minmax(0,1fr) 112px;align-items:center;gap:10px;font-size:var(--fs-body)}.comparison-bar-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-weight:600}.comparison-track{height:18px;background:#edf0f2;overflow:hidden}.comparison-bar{height:100%;min-width:4px;background:#9099a2}.comparison-bar.system{background:#456b84}.comparison-value{text-align:right;font-weight:750;font-variant-numeric:tabular-nums;white-space:nowrap}.comparison-scene-table{display:grid;margin-top:20px;border:1px solid var(--line);border-radius:6px;overflow:hidden}.comparison-scene-row{display:grid;grid-template-columns:80px minmax(130px,.75fr) minmax(180px,1.25fr);align-items:center;gap:14px;padding:13px 15px;border-top:1px solid var(--line-soft)}.comparison-scene-row:first-child{border-top:0}.comparison-scene-row span{font-weight:650;font-variant-numeric:tabular-nums}.comparison-scene-row small{color:var(--muted);font-size:13px;line-height:1.4}.comparison-meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:20px}.comparison-meta article{padding:13px 15px;border:1px solid var(--line);border-radius:6px;background:#fbfcfd}.comparison-meta label{display:block;color:var(--quiet);font-size:12px;font-weight:700}.comparison-meta strong{display:block;margin-top:6px;font-size:var(--fs-body);line-height:1.4}.comparison-detail-note{margin-top:18px;padding:13px 15px;border-left:3px solid #8c959f;background:#f6f8fa;color:#4b535b;font-size:var(--fs-body);line-height:1.55}#comparison-detail{width:min(720px,96vw)}.comparison-detail-title{margin:0;font-size:var(--fs-h1);line-height:1.25}.comparison-detail-lead{margin:12px 0 0;color:#3f474f;font-size:var(--fs-body);font-weight:650}.innovation-link{margin-top:auto;padding-top:14px}.innovation-link .button{width:100%}

  function cmpValue(metric,value,side){if(side&&metric[side+'_display'])return metric[side+'_display'];var n=Number(value);if(!Number.isFinite(n))return '-';if(metric.unit==='%')return (n*100).toFixed(metric.digits==null?2:metric.digits)+'%';if(metric.unit==='B')return Math.round(n).toLocaleString('zh-CN')+' 字节';if(metric.unit==='count')return Math.round(n)+' 次';return n.toFixed(metric.digits==null?2:metric.digits)+(metric.unit?' '+metric.unit:'')}
  function cmpCardValue(metric,value,side){if(metric.card_unit==='MB'&&Number.isFinite(Number(value)))return (Number(value)/1000000).toFixed(metric.card_digits==null?2:metric.card_digits)+' 兆字节';return cmpValue(metric,value,side)}
  function cmpBarWidth(value,maxValue){var n=Number(value),m=Number(maxValue);return Number.isFinite(n)&&Number.isFinite(m)&&m>0?Math.max(3,Math.min(100,n/m*100)).toFixed(2):3}
  function experimentQuestion(id){var questions={model_ttft:'两边输入和输出长度相同时，边缘小模型比云端大模型多久开始输出？',industrial_threshold:'同一开发数据上，调整判断阈值能否减少互相矛盾的处置动作，并保持分类效果？',traffic_retention:'同一1600个交通事件上，边缘小模型与传统树模型相比，保留了多少标签预测能力？',industrial_communication:'同一批工业事件中，只在状态需要时上传热图，能减少多少双向网络传输量？',traffic_communication:'同一400个交通事件中，先传摘要能否在不改变五类业务结果的前提下降低通信量？',node_scale:'移除一个交通节点后，传感器覆盖、剩余事件结果和全局道路决策会变化多少？',weak_network:'工业和交通在各自弱网测试中，能否维持本地业务并在网络恢复后完成补发？',controlled_conflict:'人为设置冲突后，两个场景能否按各自规则进入正确的处理流程？',model_used_encoding:'根据模型实际使用的信息重新编码，能否减少生成式小模型的等待时间和树模型每个事件的数据量？',summary_evidence:'先发送摘要，只在复核需要时补充特征数据或相关节点的原始数据，能否减少预先上传的数据并保持结果一致？',dual_timescale:'系统能否先返回经过安全检查的边缘结果，再在数据到齐后确认或更新最终结果？'};return questions[id]||'该实验比较了什么，以及主要指标发生了怎样的变化？'}

  function updateLive(){
    var dot=el('live-dot'),label=el('live-label');dot.className='live-dot';

  function bind(){document.querySelectorAll('.nav-button').forEach(function(b){b.onclick=function(){setPage(b.dataset.page)}});el('refresh').onclick=refresh;el('connection').onclick=openDrawer;el('close').onclick=closeDrawer;el('tech-close').onclick=closeTech;el('backdrop').onclick=function(){closeDrawer();closeTech()};document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeDrawer();closeTech()}});el('test').onclick=function(){testConnections(false)};el('save').onclick=function(){testConnections(true)}}

  function refresh(){if(state.loading)return;state.loading=true;el('refresh').disabled=true;var ep=endpoints();Promise.all([api('/api/demo'),api('/api/deployment/catalog'),api('/api/connections/test',{method:'POST',body:JSON.stringify({edge_url:ep.edge_url,cloud_url:ep.cloud_url,timeout_seconds:3})})]).then(function(v){state.data=v[0];state.catalog=v[1];state.runtime=v[2];render();toast('证据与设备状态已刷新')}).catch(function(err){console.error(err);toast('刷新失败，保留上一次结果')}).finally(function(){state.loading=false;el('refresh').disabled=false})}
