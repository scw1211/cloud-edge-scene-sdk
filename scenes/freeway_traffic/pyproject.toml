[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-edge-freeway-traffic-scene"
version = "0.1.0"
description = "Portable two-edge traffic reference scene for cloud-edge-scene-sdk"
requires-python = ">=3.9"
dependencies = ["cloud-edge-scene-sdk>=0.12,<0.13"]

[tool.setuptools.packages.find]
include = ["freeway_traffic_scene*"]

[tool.setuptools.package-data]
freeway_traffic_scene = ["*.json"]
