[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-edge-freeway-traffic-scene"
version = "0.2.0"
description = "Real weighted two-edge traffic scene for cloud-edge-scene-sdk"
requires-python = ">=3.9"
dependencies = ["cloud-edge-scene-sdk>=0.13,<0.14"]

[tool.setuptools.packages.find]
include = [
  "freeway_traffic_scene*",
  "freeway_traffic_full*",
  "traffic_system*",
  "lib*",
  "model*"
]

[tool.setuptools.package-data]
freeway_traffic_scene = ["*.json"]
freeway_traffic_full = ["*.json"]
