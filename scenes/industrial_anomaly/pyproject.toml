[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-edge-industrial-anomaly-scene"
version = "0.1.0"
description = "RGB/infrared industrial anomaly scene for cloud-edge-scene-sdk"
requires-python = ">=3.8"
dependencies = ["cloud-edge-scene-sdk>=0.13,<0.14"]

[tool.setuptools.packages.find]
include = ["industrial_anomaly*"]

[tool.setuptools.package-data]
industrial_anomaly = ["*.json"]
